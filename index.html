<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ASCEND — 60-Day Lock In</title>
<style>
/* ============ 1. DESIGN TOKENS ============ */
:root{
  /* background */
  --bg-top:    #0A0613;
  --bg-bot:    #1A1033;
  --card:      #150E28;
  --card-hi:   #1E1540;
  --line:      rgba(139,92,246,0.16);
  /* text */
  --text:      #F4F1FB;
  --dim:       #A79CC7;
  --faint:     #6B6288;
  /* accents */
  --violet:      #7C3AED;
  --violet-lite: #A78BFA;
  --glow:        rgba(124,58,237,0.45);
  --green:       #34D399;
  --amber:       #F59E0B;
  --blue:        #3B82F6;
  --red:         #EF4444;
  /* badge tier tokens (own badge art, not in the measured palette) */
  --silver:    #B9BFD4;
  --bronze:    #C98A5B;
  --font: -apple-system,"SF Pro Display",Inter,system-ui,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{color-scheme:dark;}
html,body{height:100%;}
body{
  margin:0;
  color:var(--text);
  font-family:var(--font);
  font-size:15px;line-height:1.45;font-weight:400;
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 100%) fixed var(--bg-top);
  overflow-x:hidden;
}
::selection{background:var(--violet);color:var(--text);}
button{font-family:var(--font);color:inherit;}
input,select,textarea{font-family:var(--font);}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--violet-lite);outline-offset:2px;border-radius:6px;}

/* ============ background fx: starfield + diagonals ============ */
#bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.star{position:absolute;border-radius:50%;background:rgba(255,255,255,1);}
.star.tw{animation:twinkle 4.5s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:var(--so,.2);}50%{opacity:.55;}}
.slash{
  position:absolute;left:-60%;width:240%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(167,139,250,.10) 30%,rgba(167,139,250,.10) 70%,transparent);
  transform:rotate(-26deg);
}

/* ============ 2. APP SHELL ============ */
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100dvh;}
#topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 20px 10px;
  background:rgba(10,6,19,.72);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:.06em;}
.logo svg{width:22px;height:22px;display:block;}
.topright{display:flex;align-items:center;gap:10px;}
.streak{
  display:flex;align-items:center;gap:5px;
  border:1px solid var(--amber);border-radius:999px;background:transparent;
  padding:5px 11px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;
}
.streak svg{width:14px;height:14px;color:var(--amber);}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:none;
  display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--text);
  border:1px solid var(--line);
}

#views{padding:0 20px calc(88px + env(safe-area-inset-bottom));}
.view{display:none;}
.view.on{display:block;animation:vin .18s ease;}
@keyframes vin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* bottom navigation */
#tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:30;
  display:flex;
  background:rgba(10,6,19,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:4px 0;cursor:pointer;
  color:var(--faint);font-size:10px;font-weight:600;line-height:1;
}
.tab svg{width:22px;height:22px;}
.tab.active{color:var(--violet);}

/* ============ shared type + surfaces ============ */
.vtitle{font-size:30px;font-weight:700;line-height:1.1;margin:10px 0 18px;}
.microlabel{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);}
.lab{font-size:13px;font-weight:600;color:var(--dim);}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:16px;margin-bottom:12px;position:relative;
}
.subcard{background:var(--card-hi);border:1px solid var(--line);border-radius:16px;padding:12px;}
.secrow{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;}
.addbtn{
  width:28px;height:28px;border-radius:999px;border:1px solid var(--line);
  background:var(--card-hi);color:var(--violet-lite);display:grid;place-items:center;cursor:pointer;
}
.addbtn svg{width:14px;height:14px;}
.empty{
  border:1px dashed var(--line);border-radius:16px;padding:20px 16px;
  color:var(--faint);font-size:13px;text-align:center;margin-bottom:12px;
}

/* press feedback */
.press{transition:transform .09s ease,filter .09s ease;cursor:pointer;}
.press:active{transform:scale(.97);filter:brightness(1.15);}

/* buttons */
.btn{
  border:0;border-radius:16px;padding:0 18px;height:46px;
  font-size:15px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn svg{width:18px;height:18px;flex:none;}
.btn-primary{background:var(--violet);color:var(--text);box-shadow:0 0 24px var(--glow);}
.btn-ghost{background:var(--card-hi);color:var(--text);border:1px solid var(--line);}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}
.btn-block{width:100%;}
.bigbtn{height:54px;font-size:16px;font-weight:700;}
.pillbtn{
  display:flex;align-items:center;gap:4px;margin:12px auto;width:max-content;
  border:1px solid var(--line);border-radius:999px;background:transparent;
  padding:8px 16px;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;
}
.pillbtn svg{width:14px;height:14px;flex:none;}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  border-radius:999px;padding:9px 16px;border:1px solid var(--line);
  background:var(--card);color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;
}
.chip.sel{background:var(--violet);color:var(--text);border-color:transparent;}

/* ============ 3.1 HOME ============ */
.weekrow{display:flex;justify-content:space-between;margin:6px 0 4px;}
.wcol{display:flex;flex-direction:column;align-items:center;gap:6px;}
.wkday{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--faint);}
.wkc{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--faint);font-size:13px;
}
.wkc svg{width:16px;height:16px;}
.wkc.done{background:var(--violet);border-color:var(--violet);color:var(--text);}
.wkc.fut{opacity:.4;}
.wkc.today{border:2px solid var(--violet-lite);color:var(--dim);}
.wkc.today.done{background:var(--violet);color:var(--text);}
@media (max-width:340px){.wkc{width:34px;height:34px;}}

.lockwrap{display:flex;flex-direction:column;align-items:center;padding:22px 0 8px;}
.lockcirc{
  width:200px;height:200px;border-radius:50%;
  border:2px solid var(--violet);
  background:radial-gradient(circle at 50% 40%,rgba(124,58,237,.40),rgba(124,58,237,.10) 58%,transparent 76%);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 0 24px var(--glow);
}
.lockcirc svg{width:56px;height:56px;color:var(--text);}
.lockcirc.on{animation:lockpulse 4s ease-in-out infinite;}
@keyframes lockpulse{0%,100%{box-shadow:0 0 24px var(--glow);}50%{box-shadow:0 0 46px var(--glow);}}
.lockcirc.off{
  border-color:var(--line);box-shadow:none;
  background:radial-gradient(circle at 50% 40%,rgba(124,58,237,.16),transparent 70%);
}
.lockcirc.off svg{color:var(--faint);}
.locklabel{margin-top:16px;font-size:13px;font-weight:600;color:var(--violet-lite);}
.lockbig{font-size:48px;font-weight:800;line-height:1.1;letter-spacing:-.01em;}
.lockbig small{font-size:26px;font-weight:700;color:var(--dim);margin-left:4px;}
.lockpill{
  margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:7px 16px;font-size:14px;font-weight:600;color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.lockoff-label{margin-top:16px;font-size:15px;color:var(--faint);}
.lockstart{margin-top:12px;}

.blockedhead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--dim);}
.bdot{width:8px;height:8px;border-radius:50%;background:var(--violet);box-shadow:0 0 8px var(--glow);}
.bchips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;}
.bchips::-webkit-scrollbar{display:none;}
.bchip{
  flex:none;display:flex;align-items:center;gap:6px;
  background:var(--card-hi);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap;
}
.bchip svg{width:13px;height:13px;color:var(--faint);}
.bnote{font-size:11px;color:var(--faint);margin-top:6px;}

.goal{overflow:hidden;padding-bottom:20px;cursor:pointer;}
.gtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.gtitle{font-size:17px;font-weight:600;overflow-wrap:anywhere;}
.gdays{font-size:12px;color:var(--faint);margin-top:3px;}
.gpct{
  flex:none;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;
  background:var(--violet);color:var(--text);
}
.gpct.full{background:var(--green);color:var(--bg-top);}
.gtrack{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);}
.gbar{height:100%;background:var(--violet);box-shadow:0 0 10px var(--glow);}
.gbar.full{background:var(--green);box-shadow:0 0 10px rgba(52,211,153,.45);}

.habit{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;}
.hicon{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;}
.hicon svg{width:15px;height:15px;}
.hmain{flex:1;min-width:0;}
.hname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hsub{font-size:12px;color:var(--faint);margin-top:1px;}
.htrack{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden;}
.hbar{height:100%;border-radius:2px;}
.hright{display:flex;align-items:center;gap:10px;flex:none;}
.hcount{font-size:12px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums;}
.ck{
  width:28px;height:28px;border-radius:50%;flex:none;cursor:pointer;
  border:2px solid var(--faint);background:transparent;color:transparent;
  display:grid;place-items:center;padding:0;
  transition:transform .09s ease;
}
.ck svg{width:13px;height:13px;}
.ck:active{transform:scale(.9);}
.ck.on{color:var(--text);animation:ckpop .25s ease;}
@keyframes ckpop{0%{transform:scale(.4);}70%{transform:scale(1.14);}100%{transform:scale(1);}}
.burst{animation:burst .45s ease;}
@keyframes burst{0%{box-shadow:0 0 0 0 var(--glow);}100%{box-shadow:0 0 0 14px rgba(124,58,237,0);}}

.task{display:flex;align-items:center;gap:12px;padding:12px 16px;}
.ttitle{flex:1;min-width:0;font-size:15px;font-weight:600;overflow-wrap:anywhere;}
.ttitle.done{color:var(--faint);text-decoration:line-through;}
.tcat{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:1px;}

/* ============ 3.2 FOCUS ============ */
.fscard{display:flex;align-items:center;gap:16px;}
.ringwrap{position:relative;width:80px;height:80px;flex:none;}
.ringwrap svg{width:80px;height:80px;transform:rotate(-90deg);}
.ringc{fill:none;stroke:rgba(255,255,255,.08);stroke-width:6;}
.ringv{fill:none;stroke:var(--green);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .4s ease;}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ringnum{font-size:28px;font-weight:800;line-height:1;}
.ringlab{font-size:10px;color:var(--faint);margin-top:2px;}
.fstitle{font-size:17px;font-weight:600;}
.fsstatus{font-size:13px;color:var(--dim);margin-top:3px;}
.sesscard .lab{font-size:12px;}
.sessnum{font-size:24px;font-weight:700;margin-top:4px;}

/* focus overlay */
#overlay[hidden]{display:none;}
#overlay{
  position:fixed;inset:0;z-index:60;
  background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
.ovlabel{font-size:13px;font-weight:600;color:var(--violet-lite);letter-spacing:.12em;text-transform:uppercase;}
.ovclock{font-size:72px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:14px 0 6px;}
.ovsub{font-size:13px;color:var(--faint);max-width:260px;}
.ovring{
  width:230px;height:230px;border-radius:50%;border:2px solid var(--violet);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,rgba(124,58,237,.35),transparent 72%);
  box-shadow:0 0 24px var(--glow);animation:lockpulse 4s ease-in-out infinite;
  margin-bottom:28px;
}
.ovring .ovclock{font-size:52px;margin:6px 0 2px;}
.ovdone{font-size:44px;font-weight:800;color:var(--green);}

/* ============ 3.3 PROGRESS ============ */
.prow{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 6px;}
.pday{font-size:22px;font-weight:700;}
.pday span{color:var(--faint);font-weight:600;}
.pclock{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--dim);}
.psub{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;display:flex;justify-content:space-between;}

.badgewrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px;}
.badgering{position:relative;width:180px;height:180px;}
.badgering > svg.arc{position:absolute;inset:0;transform:rotate(-90deg);}
.arcbg{fill:none;stroke:rgba(255,255,255,.07);stroke-width:3;}
.arcfg{fill:none;stroke:var(--violet);stroke-width:3;stroke-linecap:round;}
.badgeart{position:absolute;inset:0;display:grid;place-items:center;}
.badgeart svg{width:112px;height:112px;filter:drop-shadow(0 0 18px var(--glow));}
.badgename{margin-top:14px;font-size:17px;font-weight:600;color:var(--violet-lite);}
.rrpill{
  margin-top:8px;display:flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:13px;font-weight:700;
}
.rrpill svg{width:13px;height:13px;color:var(--violet-lite);}

.linkcard{
  display:flex;align-items:center;gap:10px;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;margin:14px 0 12px;font-size:15px;font-weight:600;color:var(--text);
  cursor:pointer;text-align:left;
}
.linkcard svg{width:18px;height:18px;color:var(--violet-lite);}
.linkcard .spacer{flex:1;}
.linkcard .chev{color:var(--faint);}

.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.cardhead h3{margin:0;font-size:17px;font-weight:600;}
.cardhead .r{font-size:12px;color:var(--faint);font-weight:600;}
.grid60{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;}
.g60{aspect-ratio:1;border-radius:6px;background:rgba(255,255,255,.06);}
.g60.full{background:var(--violet);box-shadow:0 0 6px var(--glow);}
.g60.part{background:rgba(124,58,237,.35);}
.g60.fut{background:transparent;border:1px solid var(--line);}
.g60.todayempty{background:transparent;border:1px solid var(--violet-lite);}

.heathead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.heathead h3{margin:0;font-size:17px;font-weight:600;}
.heatstats{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.heatstats .hs1{font-size:15px;font-weight:600;}
.heatstats .hs2{font-size:11px;color:var(--faint);}
.minipill{
  display:flex;align-items:center;gap:4px;border:1px solid var(--amber);border-radius:999px;
  padding:3px 9px;font-size:12px;font-weight:600;
}
.minipill svg{width:11px;height:11px;color:var(--amber);}
.heatbody{display:flex;gap:6px;}
.heatdays{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;flex:none;}
.heatdays span{font-size:9px;font-weight:600;color:var(--faint);display:flex;align-items:center;justify-content:center;width:10px;}
.heatgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;flex:1;}
.hcell{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.05);min-width:0;}
.hcell.fut{background:transparent;border:1px solid rgba(139,92,246,.08);}
.morebtn{
  margin:12px auto 0;display:block;border:1px solid var(--line);border-radius:999px;
  background:transparent;color:var(--dim);font-size:12px;font-weight:600;
  padding:6px 18px;cursor:pointer;
}

/* ============ 3.4 INSIGHTS ============ */
.backrow{display:flex;align-items:center;margin:10px 0 18px;position:relative;justify-content:center;}
.backrow h2{margin:0;font-size:17px;font-weight:600;}
.backbtn{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;
}
.backbtn svg{width:16px;height:16px;}
.ratbig{font-size:46px;font-weight:800;line-height:1.05;margin:6px 0 2px;}
.ratbig small{font-size:24px;font-weight:700;color:var(--dim);}
.ratxp{font-size:13px;color:var(--dim);}
.rattrack{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin:12px 0 8px;overflow:hidden;}
.ratbar{height:100%;background:var(--violet);box-shadow:0 0 10px var(--glow);}
.ratnote{font-size:11px;color:var(--faint);}
.h20{font-size:20px;font-weight:700;margin:20px 0 12px;}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.attr{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;}
.attrtop{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);font-weight:600;}
.attrtop svg{width:13px;height:13px;}
.attrnum{font-size:30px;font-weight:800;margin:8px 0 10px;}
.attrtrack{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;}
.attrbar{height:100%;border-radius:2px;}

/* ============ 3.5 RANK LADDER ============ */
.ladder{position:relative;padding:10px 0 30px;}
.lpath{
  position:absolute;left:50%;top:0;bottom:0;width:40px;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(124,58,237,0),rgba(124,58,237,.38) 6%,rgba(124,58,237,.38) 94%,rgba(124,58,237,0));
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);
}
.lrow{
  position:relative;display:grid;grid-template-columns:1fr 76px 1fr;align-items:center;
  padding:9px 4px;border-radius:16px;margin-bottom:4px;
}
.lrow.me{background:var(--card-hi);border:1px solid var(--violet);box-shadow:0 0 24px var(--glow);}
.lbadge{display:grid;place-items:center;}
.lbadge svg{width:52px;height:52px;filter:drop-shadow(0 0 8px rgba(124,58,237,.35));}
.lname{font-size:15px;font-weight:700;}
.lstats .lrr{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
.lstats .lpct{font-size:11px;color:var(--faint);margin-top:1px;}
.lcell-l{text-align:right;padding-right:6px;}
.lcell-r{text-align:left;padding-left:6px;}

/* ============ 3.6 COMMUNITY ============ */
.commhead{display:flex;align-items:center;justify-content:space-between;margin:10px 0 14px;}
.commhead h1{margin:0;font-size:30px;font-weight:700;}
.cicons{display:flex;gap:8px;}
.cico{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--dim);display:grid;place-items:center;cursor:pointer;
}
.cico svg{width:17px;height:17px;}
.filter{
  display:flex;align-items:center;gap:6px;margin-bottom:14px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);
  padding:7px 14px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;width:max-content;
}
.filter svg{width:12px;height:12px;color:var(--faint);}
.post{cursor:pointer;}
.phead{display:flex;align-items:center;gap:9px;}
.pava{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;}
.pmeta{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14ch;}
.prank{font-size:13px;color:var(--violet-lite);font-weight:600;display:flex;align-items:center;gap:4px;}
.prank svg{width:14px;height:14px;}
.pvote{
  flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;
  background:none;border:0;color:var(--faint);cursor:pointer;padding:2px 6px;
}
.pvote svg{width:16px;height:16px;}
.pvote b{font-size:13px;font-weight:700;}
.pvote.voted{color:var(--violet-lite);}
.pts{font-size:11px;color:var(--faint);margin:7px 0 5px;}
.ptitle{font-size:17px;font-weight:600;overflow-wrap:anywhere;}
.pbody{
  font-size:15px;color:var(--dim);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pfoot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
.pwm{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--faint);}
.pwm svg{width:12px;height:12px;}
.pcom{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--dim);}
.pcom svg{width:14px;height:14px;}
.commnote{text-align:center;font-size:11px;color:var(--faint);padding:8px 0 16px;}
.comment{padding:10px 0;border-top:1px solid var(--line);}
.comment .ca{font-size:13px;font-weight:600;}
.comment .ct{font-size:11px;color:var(--faint);margin-left:6px;font-weight:400;}
.comment p{margin:3px 0 0;font-size:14px;color:var(--dim);}

/* ============ 3.7 LIBRARY ============ */
.libtabs{display:flex;gap:22px;margin-bottom:16px;}
.libtab{
  background:none;border:0;padding:0 2px 9px;cursor:pointer;
  font-size:15px;font-weight:600;color:var(--dim);
  border-bottom:3px solid transparent;
}
.libtab.active{color:var(--text);border-bottom-color:var(--violet);}
.feat{display:flex;gap:14px;cursor:pointer;}
.fcover{
  width:90px;height:130px;flex:none;border-radius:12px;
  display:flex;align-items:flex-end;padding:8px;
  font-size:11px;font-weight:700;line-height:1.25;color:var(--text);
  text-shadow:0 1px 4px rgba(10,6,19,.6);
}
.fmain{flex:1;min-width:0;display:flex;flex-direction:column;}
.ftitle{font-size:19px;font-weight:700;line-height:1.2;}
.fauthor{font-size:14px;color:var(--dim);margin-top:2px;}
.fdesc{
  font-size:13px;color:var(--dim);margin-top:6px;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.ffoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.fpages{font-size:12px;color:var(--faint);}
.fread{font-size:13px;font-weight:600;color:var(--violet);background:none;border:0;cursor:pointer;padding:0;}
.countpill{
  border:1px solid var(--line);border-radius:999px;background:var(--card);
  padding:4px 11px;font-size:12px;font-weight:600;color:var(--dim);
}
.bookgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.bk{cursor:pointer;}
.bkcover{
  aspect-ratio:9/13;border-radius:12px;
  display:flex;align-items:flex-end;padding:10px;
  font-size:13px;font-weight:700;line-height:1.25;color:var(--text);
  text-shadow:0 1px 4px rgba(10,6,19,.6);position:relative;overflow:hidden;
}
.bkdone{
  position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;
  background:var(--green);color:var(--bg-top);display:grid;place-items:center;
}
.bkdone svg{width:11px;height:11px;}
.bkname{font-size:14px;font-weight:600;margin-top:8px;line-height:1.25;}
.bkauthor{font-size:12px;color:var(--faint);margin-top:1px;}
.bkprog{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden;}
.bkprog div{height:100%;background:var(--violet);}

/* reader */
.rdtrack{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-bottom:18px;overflow:hidden;}
.rdbar{height:100%;background:var(--violet);box-shadow:0 0 10px var(--glow);transition:width .3s ease;}
.rdtitle{font-size:19px;font-weight:700;}
.rdauthor{font-size:13px;color:var(--dim);margin:2px 0 16px;}
.rdpage{font-size:15px;line-height:1.65;color:var(--text);min-height:44vh;animation:vin .18s ease;}
.rdpage p{margin:0 0 14px;}
.rdctl{display:flex;align-items:center;justify-content:space-between;margin-top:20px;}
.rdnum{font-size:12px;color:var(--faint);font-weight:600;}
.rdbtn{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;
}
.rdbtn:disabled{opacity:.3;cursor:default;}
.rdbtn svg{width:17px;height:17px;}

/* ============ 3.8 ONBOARDING ============ */
#onb[hidden]{display:none;}
#onb{min-height:100dvh;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));position:relative;z-index:1;max-width:480px;margin:0 auto;}
.obar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:36px;}
.obar div{height:100%;background:var(--violet);box-shadow:0 0 10px var(--glow);transition:width .3s ease;}
.ostep{flex:1;display:flex;flex-direction:column;animation:vin .18s ease;}
.ohero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.ohero .biglock{
  width:120px;height:120px;border-radius:50%;border:2px solid var(--violet);
  display:grid;place-items:center;box-shadow:0 0 24px var(--glow);
  background:radial-gradient(circle at 50% 40%,rgba(124,58,237,.4),transparent 72%);
  margin-bottom:28px;
}
.ohero .biglock svg{width:44px;height:44px;}
.oh1{font-size:30px;font-weight:700;line-height:1.15;margin:0 0 10px;}
.oh1 span{color:var(--violet-lite);}
.osub{font-size:15px;color:var(--dim);max-width:300px;margin:0 auto;}
.oinp{
  width:100%;background:var(--card-hi);border:1px solid var(--line);border-radius:16px;
  padding:15px 16px;color:var(--text);font-size:17px;font-weight:600;margin-top:20px;
}
.oinp::placeholder{color:var(--faint);font-weight:400;}
.areagrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
.area{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px 14px;cursor:pointer;text-align:left;color:var(--text);
}
.area svg{width:20px;height:20px;color:var(--dim);margin-bottom:8px;}
.area b{display:block;font-size:14px;font-weight:600;}
.area span{display:block;font-size:11px;color:var(--faint);margin-top:2px;}
.area.sel{background:var(--card-hi);border-color:var(--violet);box-shadow:0 0 12px var(--glow);}
.area.sel svg{color:var(--violet-lite);}
.modecard{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:18px 16px;cursor:pointer;text-align:left;color:var(--text);margin-top:12px;
}
.modecard b{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;}
.modecard b svg{width:16px;height:16px;}
.modecard p{margin:6px 0 0;font-size:13px;color:var(--dim);}
.modecard.sel{background:var(--card-hi);border-color:var(--violet);box-shadow:0 0 16px var(--glow);}
.ofoot{margin-top:26px;}
.ocount{text-align:center;font-size:12px;color:var(--faint);margin-bottom:10px;}
.planbar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:26px 0 14px;width:100%;}
.planbar div{height:100%;background:var(--violet);box-shadow:0 0 10px var(--glow);transition:width .25s linear;}
.plandone{color:var(--green);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:center;}
.plandone svg{width:18px;height:18px;}

/* ============ MODALS ============ */
#modals{position:relative;z-index:70;}
.sheet{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;z-index:70;}
.sheet .back{position:absolute;inset:0;background:rgba(5,3,10,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.sheet .panel{
  position:relative;width:100%;max-width:480px;max-height:82dvh;overflow-y:auto;
  background:var(--card);border:1px solid var(--line);border-bottom:0;
  border-radius:24px 24px 0 0;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  animation:sheetup .18s ease;
}
@keyframes sheetup{from{transform:translateY(24px);opacity:0;}to{transform:none;opacity:1;}}
.mtitle{font-size:17px;font-weight:600;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;}
.mx{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card-hi);color:var(--dim);display:grid;place-items:center;cursor:pointer;}
.mx svg{width:13px;height:13px;}
.flab{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px;}
.inp{
  width:100%;background:var(--card-hi);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;color:var(--text);font-size:15px;
}
.inp::placeholder{color:var(--faint);}
textarea.inp{resize:vertical;min-height:88px;}
.btnrow{display:flex;gap:10px;margin-top:20px;}
.btnrow .btn{flex:1;}
.swatches{display:flex;gap:10px;}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
.sw.sel{border-color:var(--text);box-shadow:0 0 10px var(--glow);}
.stepper{display:flex;align-items:center;gap:14px;}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card-hi);color:var(--text);font-size:17px;cursor:pointer;}
.stepper b{font-size:17px;min-width:2ch;text-align:center;}
.blist{margin:0;padding:0;list-style:none;}
.blist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.blist li span{flex:1;font-size:15px;font-weight:600;overflow-wrap:anywhere;}
.bdel{width:28px;height:28px;border-radius:50%;border:1px solid var(--red);background:transparent;color:var(--red);display:grid;place-items:center;cursor:pointer;}
.bdel svg{width:12px;height:12px;}
.addrow{display:flex;gap:8px;margin-top:14px;}
.addrow .inp{flex:1;}
.sessrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;}
.sessrow .d{color:var(--dim);}
.sessrow .ok{color:var(--green);font-weight:600;}
.sessrow .bad{color:var(--red);font-weight:600;}
input[type=range]{accent-color:var(--violet);width:100%;}
input[type=date],input[type=time]{color-scheme:dark;}

/* ============ MOTION / A11Y ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  .press:active{transform:none;}
  .view.on,.rdpage,.ostep{animation:none;}
  .star.tw{animation:none;}
}

 {id:"reset",title:"The 60-Day Reset",author:"Aria Vale",grad:["--violet","--blue"],
  desc:"Why sixty days is long enough to change your defaults and short enough to actually finish. The playbook this whole app is built around.",
  pages:[
   "Sixty days is a strange number. It is too long to fake and too short to postpone. A week you can white-knuckle. A year you can always start later. Sixty days sits in the uncomfortable middle: close enough to see the end, far enough that only a system will carry you there.\n\nThis book is about building that system in the first three days and then getting out of its way.",
   "Start by choosing fewer things than feels ambitious. Two habits and one daily task beat seven of each, because the goal of week one is not progress — it is evidence. Evidence that you are the kind of person who does what they wrote down.\n\nEvery completed day is a vote for that identity. Sixty small votes is enough to swing the election.",
   "Design the day the night before. Not a schedule — a floor. The floor is the minimum that still counts: one focus block, one walk, ten pages. On good days you will clear it by lunch. On terrible days the floor is what saves the streak.\n\nAmbition is for mornings. Floors are for real life.",
   "Expect day eighteen. Around then the novelty is gone, the results are not visible yet, and skipping once would feel completely reasonable. This is not a crisis; it is a scheduled event. Write the day-eighteen plan now: shrink everything to five minutes, complete it anyway, go to bed.\n\nThe streak does not need a good day. It needs a day.",
   "Track honestly, or the whole machine rusts. A day where you did one of three things is a partial day — mark it as one. Partial days are not failures; they are load-bearing. A chain of partials through a brutal week is more impressive than a perfect week in easy conditions.",
   "When you break — and most people break once — restart the same evening. Not Monday. Not the first of the month. The gap between breaking and restarting is where sixty-day runs actually die. Keep the gap under twenty-four hours and the break becomes a plot point instead of an ending.",

 {id:"deep",title:"Deep Hours",author:"M. Okafor",grad:["--blue","--violet"],
  desc:"A short field guide to sitting with one hard thing until it moves. Focus as a trainable skill, not a personality trait.",
  pages:[
   "Focus is not a talent you either have or lack. It is a tolerance — the ability to stay with one hard thing while every cell suggests something easier. Tolerances are trained the same way everywhere: controlled exposure, gradually increased.\n\nStart with a block short enough that failing it would be embarrassing.",
   "The first five minutes of any session are the worst, because your brain is still auctioning off your attention to whatever bid last. Do not judge the session by them. Set the timer, start badly, and let the work itself pull you under. Momentum is a consequence, not a prerequisite.",

   "Interruptions are not equal. External ones — a phone in another room solves most — and internal ones: the sudden urge to check, look up, reorganize. For internal ones keep a scrap of paper. Write the urge down, return to the work. The list at the end is a museum of things that could wait.",

 {id:"feed",title:"The Quiet Feed",author:"S. Lindholm",grad:["--amber","--red"],
  desc:"What actually happens in the two weeks after you mute the noise — and how to survive the boredom that shows up first.",
  pages:[
   "The feed is not evil. It is simply better at its job than you are at yours. Its job is your next glance; yours is your next decade. Any honest comparison of incentives says: do not fight it on its terms. Change the terms.",
   "Day one of quiet is loud. The hand moves on its own, the pocket buzzes with phantom notifications, and boredom arrives within the hour. This is withdrawal, and it is wonderfully ordinary. Nobody has ever been harmed by reaching for a phone that holds nothing interesting.",
   "Boredom is the raw material. Under it, usually within three days, you will find the thing you were scrolling to avoid: an email, a decision, a feeling. Handling one avoided thing per day is a better use of the reclaimed minutes than any productivity system.",

 {id:"reps",title:"Small Reps",author:"D. Carter",grad:["--green","--blue"],
  desc:"Habit mechanics without the mysticism: floors, triggers, and why the second week matters more than the first.",
  pages:[
   "A habit is a bet that your future self will keep showing up. Most people size the bet by enthusiasm, which is why most habits die by Thursday. Size it by your worst day instead. If the rep survives your worst day, it will thrive on the good ones.",

 {id:"morning",title:"Morning Architecture",author:"L. Meyer",grad:["--amber","--violet"],

 {id:"unfollow",title:"Unfollow",author:"K. Adeyemi",grad:["--violet","--red"],

 {id:"night",title:"Night Shift Off",author:"P. Sørensen",grad:["--blue","--green"],

/* ================= computation rules ================= */
function taskTemplates(){ if(!S.user) return [];
  return S.user.areas.map(id=>AREAS.find(a=>a.id===id)).filter(Boolean); }
function ensureTasks(di){ if(di<1||di>DAYS||!S.user) return;
  if(!S.tasks[di]){ S.tasks[di]=taskTemplates().map(a=>({id:uid(),title:a.task,category:a.cat,done:false})); } }
function ensureAllTasks(){ const t=todayIdx(); for(let i=1;i<=t;i++) ensureTasks(i); }

function lockCovers(dk){ const d0=sod(parseKey(dk)).getTime(), d1=d0+DAY;
  const iv=[...(S.lockIn.history||[])];
  if(S.lockIn.active&&S.lockIn.startedAt) iv.push({start:S.lockIn.startedAt,end:Date.now()});
  return iv.some(v=>v.start<d1&&v.end>d0); }

function dayStats(dk){
  const di=dayIdxOf(dk);
  const t=(di>=1&&di<=DAYS?S.tasks[di]:null)||[];
  const tTot=t.length, tDone=t.filter(x=>x.done).length;
  let hTot=0,hDone=0;
  for(const h of S.habits){ const n=(h.log&&h.log[dk])||0; hTot+=h.target; hDone+=Math.min(n,h.target); }
  const fmin=S.focus.filter(f=>f.date===dk).reduce((a,f)=>a+f.minutes,0);
  const locked=lockCovers(dk);
  let acc=0,w=0;
  if(tTot){acc+=.40*(tDone/tTot);w+=.40;}
  if(hTot){acc+=.25*(hDone/hTot);w+=.25;}
  acc+=.20*Math.min(1,fmin/FOCUS_TARGET);w+=.20;
  acc+=.15*(locked?1:0);w+=.15;
  return {tTot,tDone,hTot,hDone,fmin,locked,pct:w?acc/w:0,
    activity:tDone>0||hDone>0||fmin>0};
}
function dayDone(dk){ const s=dayStats(dk);
  return S.user&&S.user.extreme ? s.pct>=.999 : s.activity; }

function computeRR(){ if(!S.user) return 0;
  const today=sod(new Date()); let sum=0,n=0;
  for(let i=0;i<7;i++){ const d=addDays(today,-i);
    if(sod(d)<sod(parseKey(S.user.startDate))) break;
    sum+=dayStats(keyOf(d)).pct; n++; }
  return n?Math.round(99*sum/n):0; }
function rankFor(rr){ return RANKS.find(r=>rr>=r.rr)||RANKS[RANKS.length-1]; }

function streak(){ if(!S.user) return 0;
  const start=sod(parseKey(S.user.startDate)); let d=sod(new Date()),n=0;
  if(!dayDone(keyOf(d))) d=addDays(d,-1);            // today can still be earned
  while(d>=start&&dayDone(keyOf(d))){n++;d=addDays(d,-1);}
  return n; }
function habitStreak(h){ let d=sod(new Date()),n=0;
  const done=dk=>((h.log&&h.log[dk])||0)>=h.target;
  if(!done(keyOf(d))) d=addDays(d,-1);
  while(done(keyOf(d))){n++;d=addDays(d,-1);}
  return n; }

function addXp(n){ S.xp=Math.max(0,S.xp+n); }
function checkDayBonus(){ const dk=todayKey(), full=dayStats(dk).pct>=.999;
  if(full&&!S.bonusDays[dk]){S.bonusDays[dk]=true;addXp(XP_DAY_BONUS);}
  else if(!full&&S.bonusDays[dk]){delete S.bonusDays[dk];addXp(-XP_DAY_BONUS);} }

function attributes(){
  const c={focus:{d:0,t:0},wisdom:{d:0,t:0},confidence:{d:0,t:0}};
  const t0=Math.max(1,todayIdx()-13);
  for(let i=t0;i<=todayIdx();i++) for(const t of (S.tasks[i]||[])){
    if(!c[t.category]) continue; c[t.category].t++; if(t.done)c[t.category].d++; }
  const sc=k=>c[k].t?Math.round(99*c[k].d/c[k].t):0;
  const f=sc("focus"),w=sc("wisdom"),co=sc("confidence");
  return {overall:Math.round((f+w+co)/3),focus:f,wisdom:w,confidence:co}; }

function focusScore(){ const today=sod(new Date()); let min=0,done=0,tot=0;
  for(const f of S.focus){ const d=sod(parseKey(f.date));
    if((today-d)/DAY<7){min+=f.minutes;tot++;if(f.completed)done++;} }
  if(!tot&&!min) return 0;
  return Math.round(Math.min(100,70*Math.min(1,min/(FOCUS_TARGET*7))+30*(tot?done/tot:0))); }

/* ================= animated number counter ================= */
function animNum(elm,to,fmt){ fmt=fmt||(v=>v);
  if(!elm) return;
  if(REDUCED()){elm.textContent=fmt(to);return;}
  const from=Number(elm.dataset.n||0); elm.dataset.n=to;
  if(from===to){elm.textContent=fmt(to);return;}
  const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/400);
    const v=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));
    elm.textContent=fmt(v); if(p<1)requestAnimationFrame(step);};
  requestAnimationFrame(step); }

function finishFocus(completed){
  const r=S.focusRun; if(!r) return;
  const mins=completed?r.dur:clamp(Math.floor((Date.now()-r.started)/60000),0,r.dur);
  S.focus.push({date:r.date,minutes:mins,completed});
  if(mins>0) addXp(mins);

  const o=$("#overlay");

    ? `<div class="ovdone">✓</div><div class="ovlabel" style="margin-top:10px">Session complete</div>

       <div class="ovsub" style="margin-top:6px">${mins>0?mins+" min logged, no completion":"No time logged"}</div>`;

}

function heatmapHTML(color,valueFn,weeks){
  const now=sod(new Date());
  const sun=addDays(now,-now.getDay());           // this week's Sunday
  const first=addDays(sun,-(weeks-1)*7);
  const start=sod(parseKey(S.user.startDate));
  let cells="";
  for(let w=0;w<weeks;w++) for(let d=0;d<7;d++){
    const day=addDays(first,w*7+d);
    if(day>now){cells+=`<div class="hcell fut"></div>`;continue;}
    if(day<start){cells+=`<div class="hcell"></div>`;continue;}
    const r=valueFn(keyOf(day));
    let st="";
    if(r>0){ const op=r<=.25?20:r<=.5?45:r<=.75?70:100;
      st=`style="background:color-mix(in srgb, ${color} ${op}%, transparent)"`; }
    cells+=`<div class="hcell" ${st}></div>`;
  }
  const days=["S","M","T","W","T","F","S"].map(l=>`<span>${l}</span>`).join("");
  return `<div class="heatbody"><div class="heatdays">${days}</div>
    <div class="heatgrid" style="grid-template-columns:repeat(${weeks},1fr)">${cells}</div></div>`;
}

/* ================= LIBRARY ================= */
function bookProgress(b){ return S.library.progress[b.id]||0; }
function coverStyle(b){ return `background:linear-gradient(150deg,var(${b.grad[0]}),var(${b.grad[1]}) 85%);`; }
RENDER.library=function(){
  const feat=BOOKS[0];
  const mine=BOOKS.filter(b=>bookProgress(b)>0);
  const list=ui.libTab==="discover"?BOOKS:mine;
  const grid=list.length?`<div class="bookgrid">${list.map(b=>{
      const p=bookProgress(b), done=p>=b.pages.length;
      return `<div class="bk press" data-act="readBook" data-arg="${b.id}">
        <div class="bkcover" style="${coverStyle(b)}">${esc(b.title)}${done?`<span class="bkdone">${I.check}</span>`:""}</div>
        <div class="bkname">${esc(b.title)}</div><div class="bkauthor">${esc(b.author)}</div>
        ${p>0?`<div class="bkprog"><div style="width:${Math.round(100*p/b.pages.length)}%"></div></div>`:""}
      </div>`;}).join("")}</div>`
    :`<div class="empty">Nothing here yet. Start a book from Discover and it shows up in your library.</div>`;
  $("#view-library").innerHTML=`
    <h1 class="vtitle">Library</h1>
    <div class="libtabs">
      <button class="libtab ${ui.libTab==="discover"?"active":""}" data-act="libTab" data-arg="discover">Discover</button>
      <button class="libtab ${ui.libTab==="mine"?"active":""}" data-act="libTab" data-arg="mine">My Library</button>
    </div>
    ${ui.libTab==="discover"?`
    <div class="card feat" data-act="readBook" data-arg="${feat.id}">
      <div class="fcover" style="${coverStyle(feat)}">${esc(feat.title)}</div>
      <div class="fmain"><div class="ftitle">${esc(feat.title)}</div>
        <div class="fauthor">${esc(feat.author)}</div>
        <div class="fdesc">${esc(feat.desc)}</div>
        <div class="ffoot"><span class="fpages">${feat.pages.length} pages</span>
          <button class="fread" data-act="readBook" data-arg="${feat.id}">Start reading →</button></div></div>
    </div>
    <div class="secrow"><span style="font-size:17px;font-weight:600">All Books</span><span class="countpill">${BOOKS.length} books</span></div>`:""}
    ${grid}`;
};

/* reader */
RENDER.reader=function(){
  const b=BOOKS.find(x=>x.id===ui.readerBook); if(!b){show("library");return;}
  const total=b.pages.length;
  let p=clamp(S.library.progress[b.id]||0,0,total-1);
  if((S.library.progress[b.id]||0)>=total) p=total-1;   // finished → reopen last page
  const paras=b.pages[p].split("\n\n").map(t=>`<p>${esc(t)}</p>`).join("");
  const last=p===total-1;
  $("#view-reader").innerHTML=`
    <div class="backrow"><button class="backbtn press" data-act="nav" data-arg="library" aria-label="Back to library">${I.chevL}</button><h2>${esc(b.title)}</h2></div>
    <div class="rdtrack"><div class="rdbar" style="width:${Math.round(100*(p+1)/total)}%"></div></div>
    <div class="rdauthor">${esc(b.author)}</div>
    <div class="rdpage">${paras}</div>
    <div class="rdctl">
      <button class="rdbtn press" data-act="readerPrev" ${p===0?"disabled":""} aria-label="Previous page">${I.chevL}</button>
      <span class="rdnum">Page ${p+1} of ${total}</span>
      ${last
        ?`<button class="btn btn-primary press" style="height:44px" data-act="readerFinish">Finish ✓</button>`
        :`<button class="rdbtn press" data-act="readerNext" aria-label="Next page">${I.chevR}</button>`}
    </div>`;
};

A.habitCheck=(d,t,e)=>{ e.stopPropagation();
  const h=S.habits.find(x=>x.id===d.arg); if(!h)return;
  const dk=todayKey(); h.log=h.log||{};
  const n=h.log[dk]||0;
  if(n>=h.target){ addXp(-XP_HABIT*n); h.log[dk]=0; }      // undo a full habit
  else{ h.log[dk]=n+1; addXp(XP_HABIT); t.classList.add("burst"); }
  checkDayBonus(); save(); rerender();
};

};

/* ================= ONBOARDING ================= */
const ob={step:0,name:"",areas:new Set(),extreme:false};
function renderOnb(){
  const box=$("#onb"); box.hidden=false;
  const steps=5, bar=`<div class="obar"><div style="width:${(ob.step+1)/steps*100}%"></div></div>`;
  let body="";
  if(ob.step===0) body=`
    <div class="ostep"><div class="ohero">
      <div class="biglock" style="color:var(--violet-lite)">${I.lock}</div>
      <h1 class="oh1">60 days.<br><span>One locked-in you.</span></h1>
      <p class="osub">Pick a few battles, show up daily, and watch your rank climb. Everything is stored on this device only.</p>
    </div><div class="ofoot"><button class="btn btn-primary btn-block bigbtn press" id="onext">Get started</button></div></div>`;
  else if(ob.step===1) body=`
    <div class="ostep"><div class="ohero" style="align-items:stretch;text-align:left">
      <h1 class="oh1">What should we<br><span>call you?</span></h1>
      <p class="osub" style="margin:0">Shown on your posts and profile.</p>
      <input class="oinp" id="oname" maxlength="40" placeholder="Your name" value="${esc(ob.name)}">
    </div><div class="ofoot"><button class="btn btn-primary btn-block bigbtn press" id="onext">Continue</button></div></div>`;
  else if(ob.step===2) body=`
    <div class="ostep"><h1 class="oh1">Choose your<br><span>battles.</span></h1>
      <p class="osub" style="margin:0;text-align:left;max-width:none">Pick 2–4 areas. Each one becomes a daily task in your plan.</p>
      <div class="areagrid">${AREAS.map(a=>`
        <button class="area press ${ob.areas.has(a.id)?"sel":""}" data-area="${a.id}">${I[a.icon]}<b>${a.name}</b><span>${a.hint}</span></button>`).join("")}</div>
      <div class="ofoot"><div class="ocount" id="ocount"></div>
      <button class="btn btn-primary btn-block bigbtn press" id="onext">Continue</button></div></div>`;
  else if(ob.step===3) body=`
    <div class="ostep"><h1 class="oh1">Pick your<br><span>intensity.</span></h1>
      <button class="modecard press ${!ob.extreme?"sel":""}" data-mode="0"><b>${I.sun.replace("<svg",'<svg style="color:var(--violet-lite)"')}Normal</b>
        <p>One completed thing keeps the streak alive. Sustainable and forgiving.</p></button>
      <button class="modecard press ${ob.extreme?"sel":""}" data-mode="1"><b>${I.bolt.replace("<svg",'<svg style="width:16px;height:16px;color:var(--amber)"')}Extreme</b>
        <p>The streak survives only a 100% day, and leaving mid-focus-session fails it. No mercy.</p></button>
      <div class="ofoot"><button class="btn btn-primary btn-block bigbtn press" id="onext">Continue</button></div></div>`;
  else body=`
    <div class="ostep"><div class="ohero">
      <h1 class="oh1">Building your<br><span>60-day plan…</span></h1>
      <div class="planbar"><div id="pbar" style="width:0%"></div></div>
      <div id="pready" style="visibility:hidden"><div class="plandone">${I.check}Plan ready</div>
        <p class="osub" style="margin-top:10px">${[...ob.areas].map(id=>AREAS.find(a=>a.id===id).name).join(" · ")}</p></div>
    </div><div class="ofoot"><button class="btn btn-primary btn-block bigbtn press" id="onext" disabled style="opacity:.4">Enter Day 1</button></div></div>`;
  box.innerHTML=bar+body;
  const next=box.querySelector("#onext");
  if(ob.step===1){ const inp=box.querySelector("#oname");
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")next.click();}); setTimeout(()=>inp.focus(),80); }
  if(ob.step===2){
    const count=()=>{ box.querySelector("#ocount").textContent=`${ob.areas.size} of 2–4 selected`;
      const ok=ob.areas.size>=2&&ob.areas.size<=4; next.disabled=!ok; next.style.opacity=ok?1:.4; };
    box.querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.area;
      if(ob.areas.has(id)) ob.areas.delete(id);
      else if(ob.areas.size<4) ob.areas.add(id);
      b.classList.toggle("sel",ob.areas.has(id)); count(); });
    count(); }
  if(ob.step===3) box.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    ob.extreme=b.dataset.mode==="1";
    box.querySelectorAll(".modecard").forEach(x=>x.classList.toggle("sel",x===b)); });
  if(ob.step===4){ let p=0;
    const iv=setInterval(()=>{ p+=REDUCED()?100:7+Math.random()*9;
      const bar2=box.querySelector("#pbar"); if(!bar2){clearInterval(iv);return;}
      bar2.style.width=Math.min(100,p)+"%";
      if(p>=100){ clearInterval(iv);
        box.querySelector("#pready").style.visibility="visible";
        next.disabled=false; next.style.opacity=1; } },120); }
  next.onclick=()=>{
    if(next.disabled) return;
    if(ob.step===1){ ob.name=box.querySelector("#oname").value.trim()||"Climber"; }
    if(ob.step===4){ finishOnb(); return; }
    ob.step++; renderOnb(); };
}
function finishOnb(){
  S.user={name:ob.name||"Climber",avatarSeed:Math.floor(Math.random()*AVA_GRADS.length),
    startDate:todayKey(),extreme:ob.extreme,areas:[...ob.areas]};
  ensureAllTasks(); save();
  $("#onb").hidden=true; boot(false);
}

/* ================= background fx ================= */
(function stars(){
  const bg=$("#bgfx"); let html="";
  for(let i=0;i<52;i++){
    const sz=Math.random()<.6?1:2, o=(.10+Math.random()*.25).toFixed(2);
    const tw=Math.random()<.18?" tw":"";
    html+=`<span class="star${tw}" style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;width:${sz}px;height:${sz}px;opacity:${o};--so:${o};animation-delay:${(Math.random()*4).toFixed(1)}s"></span>`;
  }
  [18,46,74].forEach(t=>{html+=`<span class="slash" style="top:${t}%"></span>`;});
  bg.innerHTML=html;
})();

/* ================= tick + boot ================= */
setInterval(()=>{
  if(S.lockIn.active&&ui.view==="home") tickLock();
  if(ui.view==="progress") tickMidnight();
  if(S.focusRun&&!$("#overlay").hidden) tickOverlay();
},1000);

function boot(fromLoad){
  if(fromLoad) load();
  if(!S.user){ $("#shell").hidden=true; renderOnb(); return; }
  ensureAllTasks(); checkDayBonus(); save();
  $("#onb").hidden=true; $("#shell").hidden=false;
  renderHeader(); renderTabs(); show(ui.view);
  if(S.focusRun){ if(Date.now()>=S.focusRun.end) finishFocus(true); else showOverlay(); }
  if(!storage.ok){ const n=el(`<div class="commnote" style="position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:0;right:0;z-index:40">Storage unavailable — progress lives in memory for this visit only.</div>`); document.body.append(n); }
}
boot(true);
</script>
